# Groq console — magic-link flow (Stytch B2B Discovery + PKCE).
#
# Сверено с бандлом console.groq.com, bootstrap-ответом Stytch и живым UI:
# 1. Запрос ссылки: POST api.stytchb2b.groq.com/sdk/v1/b2b/magic_links/email/discovery/send
#    body: email_address, discovery_redirect_url, pkce_code_challenge
#    (bootstrap проекта: pkce_required_for_email_magic_links = true;
#     captcha_settings.enabled = false, dfp_protected_auth_enabled = false)
# 2. Письмо от noreply@groq.com «Your login request to Groq», ссылка живёт 1 час;
#    токен лежит в query-параметре `token`.
# 3. POST .../b2b/magic_links/discovery/authenticate с pkce_code_verifier
#    -> $.data.intermediate_session_token (Stytch заворачивает ответ в data).
# 4. POST gste.groq.io/submit -> 36-символьный telemetry id (обычный текст).
# 5. POST api.groq.com/platform/v1/user/profile/signupb2b
#    header x-stytch-telemetry-id, body intermediate_session_token
#    -> session_jwt (используется как Bearer для platform API).
# 6. PUT api.groq.com/platform/v1/user/profile -> org_id и project_id.
# 7. POST console.groq.com/api/vb-token/create {cfToken} -> vb_token
#    (на /keys стоит Turnstile, sitekey 0x4AAAAAAA04hiaY8r8_QF1r;
#     шаг помечен captcha_optional — без солвера пробуем без токена).
# 8. POST api.groq.com/platform/v1/organizations/{org_id}/api_keys?project_id=…
#    headers Bearer + groq-organization, body {name, cf_token, vb_token}
#    -> exposed_secret_key (полный ключ показывается один раз).

[meta]
name            = "groq"
base_url        = "https://console.groq.com"
success_var     = "api_key"
default_headers = { accept = "application/json" }

# ── 1. страница логина (прогрев cookie) ───────────────────────────────────────
[[step]]
name   = "login-page"
type   = "http"
method = "GET"
path   = "/signup"
expect_status   = [200]
capture_cookies = true

# ── 2. запрос magic link через Stytch B2B Discovery ──────────────────────────
[[step]]
name    = "request-magic-link"
type    = "http"
method  = "POST"
path    = "https://api.stytchb2b.groq.com/sdk/v1/b2b/magic_links/email/discovery/send"
headers = { authorization = "Basic cHVibGljLXRva2VuLWxpdmUtNThkZjU3YTktYTFmNS00MDY2LWJjMGMtMmZmOTQyZGI2ODRmOnB1YmxpYy10b2tlbi1saXZlLTU4ZGY1N2E5LWExZjUtNDA2Ni1iYzBjLTJmZjk0MmRiNjg0Zg==", x-sdk-parent-host = "https://console.groq.com", x-sdk-client = "{{stytch_client_header}}", origin = "https://console.groq.com", referer = "https://console.groq.com/" }
json    = { email_address = "{{email}}", discovery_redirect_url = "https://console.groq.com/authenticate", pkce_code_challenge = "{{pkce_challenge}}" }
expect_status   = [200]
capture_cookies = true
note    = "аккаунт создаётся через Stytch B2B Discovery flow с PKCE"

[[step]]
name = "settle"
type = "sleep"
ms   = 1500

# ── 3. письмо со ссылкой и извлечение токена ─────────────────────────────────
[[step]]
name             = "wait-login-mail"
type             = "email_wait"
subject_contains = "login request"
link_regex       = '''[?&]token=([^"'\s&<>]+)'''
timeout_secs     = 180
save_as          = "login_token"

# ── 4. обмен токена на intermediate session через Stytch Discovery ───────────
[[step]]
name    = "authenticate-token"
type    = "http"
method  = "POST"
path    = "https://api.stytchb2b.groq.com/sdk/v1/b2b/magic_links/discovery/authenticate"
headers = { authorization = "Basic cHVibGljLXRva2VuLWxpdmUtNThkZjU3YTktYTFmNS00MDY2LWJjMGMtMmZmOTQyZGI2ODRmOnB1YmxpYy10b2tlbi1saXZlLTU4ZGY1N2E5LWExZjUtNDA2Ni1iYzBjLTJmZjk0MmRiNjg0Zg==", x-sdk-parent-host = "https://console.groq.com", x-sdk-client = "{{stytch_client_header}}", origin = "https://console.groq.com", referer = "https://console.groq.com/" }
json    = { discovery_magic_links_token = "{{login_token}}", pkce_code_verifier = "{{pkce_verifier}}" }
expect_status   = [200]
extract = { intermediate_session_token = "json:$.data.intermediate_session_token" }

# ── 5. получение telemetry id от groq ─────────────────────────────────────────
# Пустой POST на /submit даёт UUID без fingerprint — risk-движок Groq считает
# такой signup ботовым (signup_blocked). Скрипт прогоняет настоящий telemetry.js
# Stytch в установленном Chrome и печатает валидный ID.
[[step]]
name         = "get-telemetry-id"
type         = "command"
command      = "node tools/telemetry.js"
save_as      = "telemetry_id"
timeout_secs = 120

# ── 6. регистрация аккаунта в Groq (получение JWT сессии) ────────────────────
[[step]]
name    = "signup-b2b"
type    = "http"
method  = "POST"
path    = "https://api.groq.com/platform/v1/user/profile/signupb2b"
headers = { x-stytch-telemetry-id = "{{telemetry_id}}", origin = "https://console.groq.com", referer = "https://console.groq.com/" }
json    = { intermediate_session_token = "{{intermediate_session_token}}" }
expect_status   = [200, 201]
extract = { session_jwt = "json:$.session_jwt", session_token = "json:$.session_token" }

# ── 7. получение id организации ───────────────────────────────────────────────
[[step]]
name    = "get-org"
type    = "http"
method  = "PUT"
path    = "https://api.groq.com/platform/v1/user/profile"
headers = { authorization = "Bearer {{session_jwt}}", origin = "https://console.groq.com", referer = "https://console.groq.com/" }
expect_status   = [200]
extract = { org_id = "json:$.user.orgs.data[0].id", project_id = "json:$.user.orgs.data[0].projects.data[0].id" }

# ── 8. создание токена верификации (Turnstile на /keys) ───────────────────────
[[step]]
name           = "create-vb-token"
type           = "http"
method         = "POST"
path           = "/api/vb-token/create"
captcha        = "turnstile"
sitekey        = "0x4AAAAAAA04hiaY8r8_QF1r"
page_url       = "https://console.groq.com/keys"
captcha_var    = "cf_token"
captcha_optional = true
headers        = { referer = "https://console.groq.com/keys", cookie = "stytch_session_jwt={{session_jwt}}" }
json           = { cfToken = "{{cf_token}}" }
expect_status  = [200]
extract        = { vb_token = "json:$.vb_token" }

# ── 9. создание API-ключа ────────────────────────────────────────────────────
[[step]]
name    = "create-key"
type    = "http"
method  = "POST"
path    = "https://api.groq.com/platform/v1/organizations/{{org_id}}/api_keys?project_id={{project_id}}"
headers = { authorization = "Bearer {{session_jwt}}", groq-organization = "{{org_id}}", origin = "https://console.groq.com", referer = "https://console.groq.com/keys" }
json    = { name = "k-{{uuid}}", cf_token = "{{cf_token}}", vb_token = "{{vb_token}}" }
expect_status = [200, 201]
extract = { api_key = "json:$.exposed_secret_key" }
note    = "полный ключ отдаётся один раз в exposed_secret_key; secret_key в списке замаскирован"
